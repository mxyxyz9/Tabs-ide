name: Smoke-test Linux AppImage artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Desktop Installers or Release Desktop run containing desktop-linux-x64"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: tabs-main/release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Launch packaged AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find tabs-main/release -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
          test -n "$appimage"
          bash tabs-main/scripts/smoke-linux-appimage.sh "$appimage"

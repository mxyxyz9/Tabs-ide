name: Smoke-test Windows installer artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Desktop Installers or Release Desktop run containing desktop-win-x64"
        required: true
        type: string
      previous_version:
        description: "Previously published installer version"
        required: false
        default: "1.3.15"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: tabs-main/release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test Windows install and locked-process upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TABS_SMOKE_PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: ./tabs-main/scripts/smoke-windows-installer.ps1

      - name: Upload Windows installer process log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-process-log
          path: |
            ${{ runner.temp }}/tabs-installer-processes.log
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/desktop-main.log
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/server-child.log
          if-no-files-found: ignore
          retention-days: 14

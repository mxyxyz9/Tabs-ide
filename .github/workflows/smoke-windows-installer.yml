name: Smoke-test desktop installer artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Desktop Installers or Release Desktop run containing desktop-win-x64"
        required: true
        type: string
      previous_version:
        description: "Previously published installer version"
        required: false
        default: "1.3.15"
        type: string
      platforms:
        description: "Artifact checks to run (win-x64, linux-x64, mac; comma-separated)"
        required: false
        default: "win-x64"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: contains(inputs.platforms, 'win-x64')
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: tabs-main/release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test Windows install and locked-process upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TABS_SMOKE_PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: ./tabs-main/scripts/smoke-windows-installer.ps1

      - name: Upload Windows installer process log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-process-log
          path: |
            ${{ runner.temp }}/tabs-installer-processes.log
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/desktop-main.log
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/server-child.log
          if-no-files-found: ignore
          retention-days: 14

  linux_smoke:
    if: contains(inputs.platforms, 'linux-x64')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: tabs-main/release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Launch packaged AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find tabs-main/release -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
          test -n "$appimage"
          bash tabs-main/scripts/smoke-linux-appimage.sh "$appimage"

  mac_smoke:
    if: contains(inputs.platforms, 'mac')
    name: Launch macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: tabs-main/release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Launch packaged app from DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find tabs-main/release -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$dmg"
          bash tabs-main/scripts/smoke-macos-dmg.sh "$dmg" "${{ matrix.arch }}"

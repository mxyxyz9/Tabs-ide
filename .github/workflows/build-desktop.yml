name: Build Desktop Installers

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: mac-arm64, mac-x64, linux-x64, win-x64)"
        required: false
        default: "mac-arm64,mac-x64,linux-x64,win-x64"
        type: string
      version:
        description: "Build version label (leave empty to use package.json version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - id: matrix
        name: Build matrix from input
        uses: actions/github-script@v7
        with:
          script: |
            const allTargets = {
              'mac-arm64':  { label: 'macOS arm64',  runner: 'macos-14',       platform: 'mac',   target: 'dmg',      arch: 'arm64' },
              'mac-x64':    { label: 'macOS x64',    runner: 'macos-13',       platform: 'mac',   target: 'dmg',      arch: 'x64'   },
              'linux-x64':  { label: 'Linux x64',    runner: 'ubuntu-24.04',   platform: 'linux', target: 'AppImage', arch: 'x64'   },
              'win-x64':    { label: 'Windows x64',  runner: 'windows-2022',   platform: 'win',   target: 'nsis',     arch: 'x64'   },
            };

            const input = '${{ inputs.platforms }}'.trim();
            const keys = input ? input.split(',').map(k => k.trim()).filter(Boolean) : Object.keys(allTargets);

            const include = [];
            for (const key of keys) {
              const entry = allTargets[key];
              if (!entry) {
                core.setFailed(`Unknown platform key: ${key}. Valid keys: ${Object.keys(allTargets).join(', ')}`);
                return;
              }
              include.push(entry);
            }

            if (include.length === 0) {
              core.setFailed('No platforms selected.');
              return;
            }

            return { include };

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Cache VS Code build
        id: vscode_build_cache
        uses: actions/cache@v4
        with:
          path: |
            tabs-code-main/node_modules
            tabs-code-main/out
            tabs-code-main/out-build
          key: vscode-build-${{ runner.os }}-${{ matrix.arch }}-node24-${{ hashFiles('tabs-code-main/package-lock.json', 'tabs-code-main/src/**', 'tabs-code-main/build/**', 'tabs-code-main/product.json') }}

      - name: Compile VS Code workbench
        if: steps.vscode_build_cache.outputs.cache-hit != 'true'
        working-directory: tabs-code-main
        run: |
          npm install
          npm run compile
          # out-build/nls.messages.{json,js} : required by the artifact assert and
          # the runtime. without-mangling avoids the protected-fields mangler error.
          npm run gulp compile-build-without-mangling

      - name: Build desktop artifact
        working-directory: tabs-main
        shell: bash
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --verbose
          )

          version="${{ inputs.version }}"
          if [[ -n "$version" ]]; then
            version="${version#v}"
            args+=(--build-version "$version")
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          shopt -s nullglob
          for pattern in \
            "tabs-main/release/*.dmg" \
            "tabs-main/release/*.zip" \
            "tabs-main/release/*.AppImage" \
            "tabs-main/release/*.exe" \
            "tabs-main/release/*.blockmap" \
            "tabs-main/release/latest*.yml" \
            "tabs-main/release/builder-debug.yml"; do
            for file in $pattern; do
              cp "$file" artifacts/
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

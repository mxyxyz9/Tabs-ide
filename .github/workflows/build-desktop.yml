name: Build Desktop Installers

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: mac-arm64, mac-x64, linux-x64, win-x64)"
        required: false
        default: "mac-arm64,mac-x64,linux-x64,win-x64"
        type: string
      version:
        description: "Build version label (leave empty to use package.json version)"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - id: matrix
        name: Build matrix from input
        uses: actions/github-script@v7
        with:
          script: |
            const allTargets = {
              'mac-arm64':  { label: 'macOS arm64',  runner: 'macos-14',       platform: 'mac',   target: 'dmg',      arch: 'arm64' },
              'mac-x64':    { label: 'macOS x64',    runner: 'macos-14',       platform: 'mac',   target: 'dmg',      arch: 'x64'   },
              'linux-x64':  { label: 'Linux x64',    runner: 'ubuntu-24.04',   platform: 'linux', target: 'AppImage', arch: 'x64'   },
              'win-x64':    { label: 'Windows x64',  runner: 'windows-2022',   platform: 'win',   target: 'nsis',     arch: 'x64'   },
            };

            const input = '${{ inputs.platforms }}'.trim();
            const keys = input ? input.split(',').map(k => k.trim()).filter(Boolean) : Object.keys(allTargets);

            const include = [];
            for (const key of keys) {
              const entry = allTargets[key];
              if (!entry) {
                core.setFailed(`Unknown platform key: ${key}. Valid keys: ${Object.keys(allTargets).join(', ')}`);
                return;
              }
              include.push(entry);
            }

            if (include.length === 0) {
              core.setFailed('No platforms selected.');
              return;
            }

            return { include };

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Install VS Code dependencies
        working-directory: tabs-code-main
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          npm install --ignore-scripts
          cd build && npm install --ignore-scripts && cd ..
          # Target the Electron that RUNS these modules at runtime (from Tabs'
          # desktop package) — not tabs-code-main's development Electron. The
          # Code-OSS server runs via ELECTRON_RUN_AS_NODE
          # on Tabs' Electron, so native modules must match its ABI.
          # `--arch` cross-builds x64 natives for the mac-x64 artifact on the
          # arm64 macos-14 runner.
          electron_version="$(node -p "const p = require('../tabs-main/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
          echo "Rebuilding Code-OSS native modules for Tabs Electron $electron_version"
          npx --yes @electron/rebuild -v "$electron_version" --arch "${{ matrix.arch }}"

      - name: Compile VS Code workbench
        working-directory: tabs-code-main
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          # out/ : dev workbench + server-main.js (skip extensions & Monaco
          # typechecking — the desktop build doesn't need them).
          npm run gulp compile-client
          # out-build/nls.messages.{json,js} : required by the artifact assert and
          # the runtime. without-mangling avoids the protected-fields mangler error.
          npm run gulp compile-build-without-mangling

      # The embedded workbench activates ALL built-in extensions at startup or on
      # file-open, not a curated few. compile-client above skips EVERY extension,
      # and the root install used --ignore-scripts (to dodge the postinstall OOM),
      # so without this step the built-ins ship with neither node_modules nor a
      # compiled out/ — at runtime the extension host throws "Cannot find module
      # .../<ext>/out/..." for each (debug-auto-launch, references-view, npm,
      # ipynb, simple-browser, …) and cascades to dependents (e.g. CodeRabbit
      # needs git; the language features need each other). Install every product
      # extension's deps and compile every product built-in to extensions/<ext>/
      # out (the dev built-in layout the runtime uses). Run unconditionally so the
      # out/ build cache above can't mask a missing extension compile. The
      # compiled-runtime guard in tabs-main/scripts/build-desktop-artifact.ts
      # verifies the result.
      - name: Compile built-in extensions
        working-directory: tabs-code-main
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -euo pipefail
          # Shared extensions package (extensions/package.json → vscode-extensions)
          # provides extensions/node_modules/typescript, which
          # typescript-language-features compiles against (referenced literally as
          # ../../../../node_modules/typescript). The parent tabs-code-main install
          # already has typescript 6.0.0-dev at the root, which npm can dedupe
          # against — leaving extensions/node_modules/typescript MISSING and the
          # compile failing with ~48 cascading type errors. Use `npm ci` for the
          # exact locked version, then hard-guarantee the local copy exists.
          (cd extensions && (npm ci --no-audit --no-fund --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts))
          if [ ! -f extensions/node_modules/typescript/lib/typescript.js ]; then
            echo "::warning::typescript not present in extensions/node_modules — forcing a nested local install"
            (cd extensions && npm install typescript@6.0.2 --no-save --no-audit --no-fund --ignore-scripts --install-strategy=nested)
          fi
          test -f extensions/node_modules/typescript/lib/typescript.js
          # Install deps for every PRODUCT built-in extension (plus any nested
          # client/ and server/ packages, e.g. the language features) so each
          # one's TypeScript compiles and its node_modules ship in the runtime.
          # Dep-less extensions (themes, grammars) are a fast no-op. Skip
          # node_modules.
          for pkg in extensions/*/package.json extensions/*/client/package.json extensions/*/server/package.json; do
            [ -f "$pkg" ] || continue
            dir="$(dirname "$pkg")"
            case "$dir" in */node_modules*) continue;; esac
            (cd "$dir" && npm install --no-audit --no-fund --ignore-scripts) || \
              echo "::warning::npm install failed for $dir (continuing; the compile below is the real check)"
          done

          # git's native fs helper (@vscode/fs-copyfile) must be built AND match
          # Tabs' current Electron ABI (the Code-OSS server runs under
          # ELECTRON_RUN_AS_NODE), else git throws "Cannot find module
          # .../build/Release/vscode_fs.node" and cascades to dependents.
          electron_version="$(node -p "const p = require('../tabs-main/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
          npx --yes @electron/rebuild -v "$electron_version" --arch "${{ matrix.arch }}" \
            --module-dir "$(pwd)/extensions/git" --only @vscode/fs-copyfile

          # Compile every PRODUCT built-in extension to extensions/<ext>/out (and
          # client/out, server/out for the language features). We deliberately do
          # NOT use the stock `compile-extensions` gulp task: it ALSO compiles the
          # three .vscode/extensions/* self-host dev tools (vscode-selfhost-*,
          # vscode-extras), which are not shipped (.vscode is stripped from the
          # staged runtime) and whose deps (cockatiel, istanbul-to-vscode) aren't
          # installed here — so it fails the build. Instead derive the product
          # task list from the gulpfile's own `compilations` array (entries whose
          # quoted path starts with `extensions/`, excluding `.vscode/...`), so the
          # names always match real `compile-extension:<name>` tasks and the set
          # can't drift, then run them in one gulp invocation.
          tasks=()
          while IFS= read -r name; do
            tasks+=("compile-extension:$name")
          done < <(grep -oE "'extensions/[^']+/tsconfig.json'" build/gulpfile.extensions.ts \
            | tr -d "'" | sed -E 's#^extensions/##; s#/tsconfig.json$##; s#/#-#g')
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::No product extension compile tasks derived from build/gulpfile.extensions.ts"
            exit 1
          fi
          echo "Compiling ${#tasks[@]} product built-in extensions"
          npm run gulp -- "${tasks[@]}"

          # Produce the same lean extension layout used by upstream Code-OSS
          # distributions instead of shipping source and dev dependencies.
          npm run gulp compile-extensions-build
          npm run gulp compile-copilot-extension-build
          test -f .build/extensions/git/node_modules/@vscode/fs-copyfile/build/Release/vscode_fs.node
          test -f .build/extensions/copilot/package.json

      - name: Build desktop artifact
        working-directory: tabs-main
        shell: bash
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --verbose
          )

          version="${{ inputs.version }}"
          if [[ -n "$version" ]]; then
            version="${version#v}"
            args+=(--build-version "$version")
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          shopt -s nullglob
          for pattern in \
            "tabs-main/release/*.dmg" \
            "tabs-main/release/*.zip" \
            "tabs-main/release/*.AppImage" \
            "tabs-main/release/*.exe" \
            "tabs-main/release/*.blockmap" \
            "tabs-main/release/latest*.yml" \
            "tabs-main/release/builder-debug.yml"; do
            for file in $pattern; do
              cp "$file" artifacts/
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

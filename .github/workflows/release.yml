name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: release_meta
        name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: tabs-main
        run: bun run typecheck

      - name: Test
        working-directory: tabs-main
        run: bun run test

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    # Fail fast instead of hanging until GitHub's 6h hard limit if the VS Code
    # compile gets stuck (e.g. memory swapping on a small runner).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-14
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Install VS Code dependencies
        working-directory: tabs-code-main
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          # Install packages without lifecycle scripts (~3 min).
          # The postinstall spawns 50+ concurrent npm install processes
          # which exhausts 7GB RAM on CI runners and hangs indefinitely.
          npm install --ignore-scripts
          cd build && npm install --ignore-scripts && cd ..

          # Rebuild native modules against Electron headers (~5-10 min).
          # @electron/rebuild handles header downloading + cross-platform
          # compilation without triggering npm lifecycle scripts (unlike
          # npm rebuild which fails on Windows due to preinstall.ts).
          #
          # IMPORTANT: target the Electron that actually RUNS these modules at
          # runtime — Tabs' Electron (apps/desktop/package.json), NOT
          # tabs-code-main's dev electron (39.8.3). The Code-OSS server is
          # spawned via ELECTRON_RUN_AS_NODE on Tabs' Electron 40 binary, so
          # @parcel/watcher / node-pty / native-keymap must match its ABI or
          # they fail with NODE_MODULE_VERSION mismatch.
          #
          # `--arch` matters: macos-14 is arm64, so the mac-x64 artifact must
          # cross-build x64 natives here, otherwise the x64 DMG ships arm64
          # binaries that won't load on Intel Macs.
          npx --yes @electron/rebuild -v 40.6.0 --arch ${{ matrix.arch }}

      - name: Compile VS Code workbench
        working-directory: tabs-code-main
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          # out/ : dev workbench + server-main.js (skip extensions & Monaco
          # typechecking — the desktop build doesn't need them).
          npm run gulp compile-client
          # out-build/nls.messages.{json,js} : required by the desktop artifact
          # assert and the runtime server. Use the without-mangling variant —
          # `compile-build` fails on the protected-fields mangler check.
          npm run gulp compile-build-without-mangling

      # The embedded workbench activates these built-in extensions at startup
      # (git-base → git, configuration-editing). compile-client above skips ALL
      # extensions, and the root install used --ignore-scripts (to dodge the
      # postinstall OOM), so they had neither node_modules nor a compile — at
      # runtime that throws "Cannot find module .../<ext>/out/..." and cascades
      # to dependents (e.g. CodeRabbit needs git). Install each one's deps and
      # compile it to extensions/<ext>/out (the dev built-in layout the runtime
      # falls back to). Run unconditionally so the out/ build cache above can't
      # mask a missing extension compile. Keep this list in sync with the
      # compiled-runtime guard in tabs-main/scripts/build-desktop-artifact.ts.
      - name: Compile required built-in extensions
        working-directory: tabs-code-main
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          for ext in git-base git configuration-editing; do
            (cd "extensions/$ext" && npm install --no-audit --no-fund --ignore-scripts)
            npm run gulp "compile-extension:$ext"
          done

      # Cache electron-builder's downloaded NSIS/7zip/winCodeSign toolchain so a
      # populated run never re-downloads it. The download host (GitHub's
      # electron-builder-binaries releases) intermittently returns 504s that
      # otherwise fail the whole release at the very end. Only the current
      # runner's path exists; the others are ignored.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-binaries-${{ runner.os }}-${{ matrix.arch }}-v1

      - name: Build desktop artifact
        working-directory: tabs-main
        shell: bash
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          # Installers for every platform, plus the electron-updater feed files
          # (latest.yml / latest-linux.yml + blockmaps) so Windows and Linux can
          # auto-update. macOS auto-update needs a code-signed build, so we ship
          # only the .dmg there (no latest-mac.yml / .zip) and users update
          # manually from the release page.
          # Each job only produces its own platform's files, so most patterns
          # match nothing on a given runner. `nullglob` drops empty *wildcard*
          # globs, but the literal latest*.yml names need an explicit existence
          # check (mac produces latest-mac.yml, win latest.yml, linux
          # latest-linux.yml).
          shopt -s nullglob
          for pattern in \
            "tabs-main/release/*.dmg" \
            "tabs-main/release/*.AppImage" \
            "tabs-main/release/*.AppImage.blockmap" \
            "tabs-main/release/*.exe" \
            "tabs-main/release/*.exe.blockmap" \
            "tabs-main/release/latest.yml" \
            "tabs-main/release/latest-linux.yml"; do
            for file in $pattern; do
              if [ -e "$file" ]; then
                cp "$file" release-publish/
              fi
            done
          done
          # Ensure the step exits 0 even when the final loop iteration's
          # existence check is false (a bare `[ -e ] && cp` as the script's
          # last command would propagate its non-zero status and fail the job
          # on platforms whose last pattern — latest-linux.yml — is absent).
          echo "Collected $(ls -1 release-publish | wc -l) asset(s)."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -lah release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: Tabs v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.AppImage.blockmap
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest.yml
            release-assets/latest-linux.yml

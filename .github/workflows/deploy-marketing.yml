name: Deploy Tabs website
on:
  push:
    branches: [main]
    paths:
      - tabs-main/apps/marketing/**
      - tabs-main/bun.lock
      - .github/workflows/deploy-marketing.yml
  release:
    types: [published]
  # Releases created by GITHUB_TOKEN do not trigger release workflows.
  # This trusted completion event covers the existing Release Desktop workflow.
  workflow_run:
    workflows: [Release Desktop]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tabs-marketing-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Add the repository Actions secret $key before deploying."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          # Always deploy trusted default-branch code, never workflow_run artifacts.
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install marketing dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile
      - name: Refresh and verify live release assets
        working-directory: tabs-main/apps/marketing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run sync:releases
      - name: Validate release resolver
        working-directory: tabs-main/apps/marketing
        run: bun run test
      - name: Typecheck site
        working-directory: tabs-main/apps/marketing
        run: bun run typecheck
      - name: Build site
        working-directory: tabs-main/apps/marketing
        run: bun run build
      - name: Package Vercel Build Output API artifact
        working-directory: tabs-main/apps/marketing
        run: |
          bun scripts/vercel-output.ts
          mkdir -p ../../../.vercel
          cp -r .vercel/output ../../../.vercel/output
      - name: Deploy production
        shell: bash
        run: |
          deployment_output="$(bunx vercel@59.11.7 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "$deployment_output"
          deployment_url="$(echo "$deployment_output" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -n 1)"
          if [[ -n "$deployment_url" ]]; then
            echo "Aliasing $deployment_url to tabside.vercel.app"
            bunx vercel@59.11.7 alias set "$deployment_url" tabside.vercel.app --token "$VERCEL_TOKEN" || true
          fi
